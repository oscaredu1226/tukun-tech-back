name: backend-ci

on:
  push:
    branches: [ main, develop, feature/care-management ]
  pull_request:

jobs:
  build-test-sonar-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test (H2 test profile)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
        run: mvn -B -DskipTests=false -Dspring.profiles.active=test -Djwt.secret=${JWT_SECRET} clean verify

      - name: SonarCloud Scan (Maven)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set. Skipping Sonar scan."
            exit 0
          fi

          mvn -B sonar:sonar \
            -Dsonar.projectKey=oscaredu1226_tukun-tech-back \
            -Dsonar.organization=oscaredu1226 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      - name: Trigger Render Deploy (feature/care-management only)
        if: github.ref == 'refs/heads/feature/care-management'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK not set. Skipping deploy."
            exit 0
          fi
          curl -X POST "${RENDER_DEPLOY_HOOK}"

      - name: Verify health after deploy (feature/care-management only)
        if: github.ref == 'refs/heads/feature/care-management'
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "${RENDER_BASE_URL}" ]; then
            echo "RENDER_BASE_URL not set. Add it as a repo secret (e.g., https://tukuntech-back.onrender.com)."
            exit 1
          fi

          HEALTH_URL="${RENDER_BASE_URL}/api/v1/actuator/health"
          echo "Checking health at: ${HEALTH_URL}"

          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is UP ✅"
              curl -s "${HEALTH_URL}"
              exit 0
            fi
            sleep 5
          done

          echo "Service did not become healthy in time ❌"
          exit 1
