name: Frontend measure login to /patient

on:
  workflow_dispatch:

jobs:
  measure-login-to-patient:
    runs-on: ubuntu-latest
    env:
      # 🔧 Ajusta estas variables o pásalas como Secrets/Vars del repo
      FRONT_URL_LOGIN: https://tukuntech-front.netlify.app/auth/login
      FRONT_URL_TARGET: https://tukuntech-front.netlify.app/patient

      # Selectores (puedes sobreescribirlos con Vars/Secrets si no calzan)
      FRONT_EMAIL_SELECTOR: 'input[name="email"],input[type="email"]'
      FRONT_PASSWORD_SELECTOR: 'input[name="password"],input[type="password"]'
      FRONT_SUBMIT_SELECTOR: 'button[type="submit"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm i -D playwright@1.47.2

      - name: Measure login → /patient with Playwright
        env:
          FRONT_EMAIL: ${{ secrets.FRONT_EMAIL }}       # <-- ponlo en Secrets
          FRONT_PASSWORD: ${{ secrets.FRONT_PASSWORD }} # <-- ponlo en Secrets
        shell: bash
        run: |
          set -euo pipefail

          cat > measure.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const loginUrl  = process.env.FRONT_URL_LOGIN;
            const targetUrl = process.env.FRONT_URL_TARGET;

            const emailSel   = process.env.FRONT_EMAIL_SELECTOR || 'input[name="email"]';
            const passSel    = process.env.FRONT_PASSWORD_SELECTOR || 'input[name="password"]';
            const submitSel  = process.env.FRONT_SUBMIT_SELECTOR || 'button[type="submit"]';

            const email = process.env.FRONT_EMAIL;
            const pass  = process.env.FRONT_PASSWORD;

            if (!email || !pass) {
              console.error("Missing FRONT_EMAIL / FRONT_PASSWORD secrets.");
              process.exit(1);
            }

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();

            // 1) Cargar login y tomar métricas de navegación
            await page.goto(loginUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForLoadState('networkidle', { timeout: 60_000 });

            const nav1 = await page.evaluate(() => {
              const n = performance.getEntriesByType('navigation')[0];
              return n ? {
                domContentLoaded: n.domContentLoadedEventEnd - n.startTime,
                loadEvent: n.loadEventEnd - n.startTime,
                responseStart: n.responseStart - n.startTime
              } : null;
            });

            // 2) Login y medir navegación a /patient
            await page.fill(emailSel, email);
            await page.fill(passSel, pass);

            const tStart = Date.now();
            await Promise.all([
              page.waitForURL('**/patient*', { timeout: 60_000 }),
              page.click(submitSel)
            ]);
            await page.waitForLoadState('networkidle', { timeout: 60_000 });
            const loginToPatientMs = Date.now() - tStart;

            // (Opcional) tiempos de la navegación ya en /patient
            const nav2 = await page.evaluate(() => {
              const n = performance.getEntriesByType('navigation')[0];
              return n ? {
                domContentLoaded: n.domContentLoadedEventEnd - n.startTime,
                loadEvent: n.loadEventEnd - n.startTime,
                responseStart: n.responseStart - n.startTime
              } : null;
            });

            console.log('RESULT_JSON_START');
            console.log(JSON.stringify({
              login_domcontent_ms: nav1?.domContentLoaded ?? null,
              login_load_ms: nav1?.loadEvent ?? null,
              login_response_start_ms: nav1?.responseStart ?? null,
              login_to_patient_ms: loginToPatientMs,
              patient_domcontent_ms: nav2?.domContentLoaded ?? null,
              patient_load_ms: nav2?.loadEvent ?? null,
            }, null, 2));
            console.log('RESULT_JSON_END');

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

          node measure.js | tee measure.log

          echo "### Frontend login → /patient timings (ms)" >> $GITHUB_STEP_SUMMARY
          sed -n '/RESULT_JSON_START/,/RESULT_JSON_END/p' measure.log | sed '1d;$d' | jq -r '
            to_entries | map("| \(.key) | \(.value) |")[]' | sed '1i| metric | value |\n|---|---|' >> $GITHUB_STEP_SUMMARY
