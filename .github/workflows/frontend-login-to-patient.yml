name: Frontend medir login → /patient

on:
  workflow_dispatch:
  push:

jobs:
  measure-login-to-patient:
    runs-on: ubuntu-latest
    env:
      LOGIN_URL: "https://tukuntech-front.netlify.app/auth/login"
      TARGET_URL: "https://tukuntech-front.netlify.app/patient"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm i playwright@1.48.2
          npx playwright install chromium
          npx playwright install-deps

      - name: Run Playwright timing
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: |
          set -euo pipefail
          cat > login_and_measure.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const LOGIN_URL  = process.env.LOGIN_URL;
          const TARGET_URL = process.env.TARGET_URL;
          const USER = process.env.E2E_USER;
          const PASS = process.env.E2E_PASS;

          const USER_DATA_DIR = '.chrome-profile';
          const NAV_TIMEOUT = 45000;       // ↑ tiempo de espera
          const FIND_TIMEOUT = 30000;

          const browser = await chromium.launchPersistentContext(USER_DATA_DIR, {
            headless: true,
            viewport: { width: 1280, height: 800 }
          });
          const page = await browser.newPage();

          // Candidatos de selectores (email / password / submit)
          const EMAIL_CANDS = [
            'input[type="email"]',
            'input[name="email"]',
            'input[autocomplete="email"]',
            '[aria-label*="email" i]',
            'input[placeholder*="email" i]',
            'input[name="username"]',
          ];
          const PASS_CANDS = [
            'input[type="password"]',
            'input[name="password"]',
            'input[autocomplete="current-password"]',
            '[aria-label*="contraseña" i], [aria-label*="password" i]',
            'input[placeholder*="contraseña" i], input[placeholder*="password" i]',
          ];
          const SUBMIT_CANDS = [
            'button[type="submit"]',
            'button:has-text("Ingresar"), button:has-text("Iniciar sesión"), button:has-text("Login"), button:has-text("Acceder")',
            'input[type="submit"]'
          ];

          // Utilidad: devuelve {frame, locator} del primer candidato que exista/sea visible
          async function findFirstVisible(cands) {
            const frames = [page.mainFrame(), ...page.frames()];
            const deadline = Date.now() + FIND_TIMEOUT;
            while (Date.now() < deadline) {
              for (const f of frames) {
                for (const sel of cands) {
                  const loc = f.locator(sel);
                  try {
                    if (await loc.first().isVisible({ timeout: 500 }).catch(() => false)) {
                      return { frame: f, locator: loc.first(), selector: sel };
                    }
                  } catch {}
                }
              }
              await page.waitForTimeout(250);
            }
            return null;
          }

          // Si hay banners/cookies, intenta cerrarlos
          async function dismissBanners() {
            const guesses = [
              'button:has-text("Aceptar")',
              'button:has-text("Accept")',
              'button:has-text("OK")',
              '[role="dialog"] button:has-text("Aceptar"), [role="dialog"] button:has-text("Accept")'
            ];
            for (const sel of guesses) {
              const btn = page.locator(sel);
              if (await btn.first().isVisible().catch(() => false)) {
                await btn.first().click().catch(()=>{});
              }
            }
          }

          try {
            console.log("🔐 Abriendo login:", LOGIN_URL);
            await page.goto(LOGIN_URL, { waitUntil: 'domcontentloaded', timeout: NAV_TIMEOUT });
            await page.waitForLoadState('networkidle', { timeout: NAV_TIMEOUT }).catch(()=>{});
            await dismissBanners();

            // Buscar campo email (en página o iframes)
            const emailHit = await findFirstVisible(EMAIL_CANDS);
            if (!emailHit) throw new Error('No se encontró input de email');
            await emailHit.locator.fill(USER, { timeout: FIND_TIMEOUT });

            // Buscar campo password
            const passHit = await findFirstVisible(PASS_CANDS);
            if (!passHit) throw new Error('No se encontró input de contraseña');
            await passHit.locator.fill(PASS, { timeout: FIND_TIMEOUT });

            // Buscar botón submit (si no, ENTER sobre password)
            const submitHit = await findFirstVisible(SUBMIT_CANDS);

            const t0 = await page.evaluate(() => performance.now());
            if (submitHit) {
              await Promise.all([
                submitHit.locator.click(),
                page.waitForURL('**/patient*', { timeout: NAV_TIMEOUT })
              ]);
            } else {
              await Promise.all([
                passHit.locator.press('Enter'),
                page.waitForURL('**/patient*', { timeout: NAV_TIMEOUT })
              ]);
            }

            await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(()=>{});
            const t1 = await page.evaluate(() => performance.now());
            const durationMs = Math.round(t1 - t0);

            console.log(`✅ Login → /patient en ${durationMs} ms`);

            const metrics = {
              metric: "frontend_login_to_patient_ms",
              duration_ms: durationMs,
              status: "success",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            };
            fs.writeFileSync('frontend_metrics.json', JSON.stringify(metrics, null, 2));
          } catch (err) {
            console.error("❌ Error midiendo login → /patient:", err?.message || err);
            try {
              await page.screenshot({ path: 'error_screenshot.png', fullPage: true });
              const html = await page.content();
              fs.writeFileSync('error_page.html', html.replace(/\s+/g,' ').slice(0, 500_000));
            } catch {}
            fs.writeFileSync('frontend_metrics.json', JSON.stringify({
              metric: "frontend_login_to_patient_ms",
              error: String(err),
              status: "failure",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            }, null, 2));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          JS

          node login_and_measure.mjs
      

      - name: Subir artefactos (resultado y screenshot si hay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend_metrics
          path: |
            frontend_metrics.json
            error_screenshot.png
