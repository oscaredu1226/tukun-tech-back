name:
  Frontend: medir login → /patient

on:
  workflow_dispatch:
  push:

jobs:
  measure-login-to-patient:
    runs-on: ubuntu-latest
    env:
      LOGIN_URL: "https://tukuntech-front.netlify.app/auth/login"
      TARGET_URL: "https://tukuntech-front.netlify.app/patient"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm i playwright@1.48.2
          npx playwright install chromium

      - name: Run Playwright timing
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: |
          cat > login_and_measure.mjs <<'JS'
          import { chromium } from 'playwright';
          const LOGIN_URL  = process.env.LOGIN_URL;
          const TARGET_URL = process.env.TARGET_URL;
          const USER = process.env.E2E_USER;
          const PASS = process.env.E2E_PASS;

          // Carpeta de perfil para persistir sesión si luego la quisieras reutilizar
          const USER_DATA_DIR = '.chrome-profile';

          const browser = await chromium.launchPersistentContext(USER_DATA_DIR, { headless: true });
          const page = await browser.newPage();

          // Helpers de selectores (ajústalos si tus inputs tienen otros attrs)
          const EMAIL_SEL = 'input[type="email"], input[name="email"], input[placeholder*="email" i]';
          const PASS_SEL  = 'input[type="password"], input[name="password"], input[placeholder*="password" i]';
          const SUBMIT_SEL= 'button[type="submit"], button:has-text("Ingresar"), button:has-text("Login")';

          const tStart = Date.now();

          try {
            console.log("🔐 Abriendo login:", LOGIN_URL);
            await page.goto(LOGIN_URL, { waitUntil: 'networkidle' });

            await page.fill(EMAIL_SEL, USER, { timeout: 15000 });
            await page.fill(PASS_SEL,  PASS, { timeout: 15000 });

            // t0 justo antes del click de login
            const t0 = await page.evaluate(() => performance.now());
            await Promise.all([
              page.click(SUBMIT_SEL),
              // Para SPA: esperar cambio de URL a /patient (captura cambios de ruta)
              page.waitForURL('**/patient*', { timeout: 60000 }),
            ]);
            // Además esperar a que la página “asiente” tráfico
            await page.waitForLoadState('networkidle', { timeout: 15000 });
            const t1 = await page.evaluate(() => performance.now());

            const durationMs = t1 - t0;
            console.log(`✅ Login → /patient en ${durationMs.toFixed(0)} ms`);

            // Guardar métricas como artefacto JSON
            const metrics = {
              metric: "frontend_login_to_patient_ms",
              duration_ms: Math.round(durationMs),
              status: "success",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            };
            const fs = await import('node:fs');
            fs.writeFileSync('frontend_metrics.json', JSON.stringify(metrics, null, 2));
          } catch (err) {
            console.error("❌ Error midiendo login → /patient:", err?.message || err);
            // Guardar error también como artefacto
            const fs = await import('node:fs');
            fs.writeFileSync('frontend_metrics.json', JSON.stringify({
              metric: "frontend_login_to_patient_ms",
              error: String(err),
              status: "failure",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            }, null, 2));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          JS

          node login_and_measure.mjs

      - name: Subir artefacto (resultado)
        uses: actions/upload-artifact@v4
        with:
          name: frontend_metrics
          path: frontend_metrics.json
