name: Frontend medir login → /patient

on:
  workflow_dispatch:
  push:

jobs:
  measure-login-to-patient:
    runs-on: ubuntu-latest
    env:
      LOGIN_URL: "https://tukuntech-front.netlify.app/auth/login"
      TARGET_URL: "https://tukuntech-front.netlify.app/patient"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm i playwright@1.48.2
          npx playwright install chromium
          npx playwright install-deps

      - name: Run Playwright timing
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: |
          set -euo pipefail
          cat > login_and_measure.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const LOGIN_URL  = process.env.LOGIN_URL;
          const TARGET_URL = process.env.TARGET_URL;
          const USER = process.env.E2E_USER;
          const PASS = process.env.E2E_PASS;

          const USER_DATA_DIR = '.chrome-profile';
          const NAV_TIMEOUT = 60000;
          const FIND_TIMEOUT = 35000;

          const browser = await chromium.launchPersistentContext(USER_DATA_DIR, {
            headless: true,
            viewport: { width: 1366, height: 900 }
          });
          const page = await browser.newPage();

          const EMAIL_LABELS = [
            'Correo', 'Correo electrónico', 'Email', 'E-mail', 'Email address',
            'Usuario', 'User', 'Username'
          ];
          const PASS_LABELS = ['Contraseña', 'Password', 'Clave', 'Pass'];

          const EMAIL_ATTRS = [
            'input[formcontrolname="username"]',
            'input[name="username"]',
            'input[placeholder*="user" i]',
            'input[id*="user" i]',
            'input[type="text"]'
          ];
          const PASS_ATTRS = [
            'input[type="password"]',
            'input[name="password"]',
            'input[id*="pass" i]',
            'input[placeholder*="contraseña" i]',
            'input[placeholder*="password" i]'
          ];
          const SUBMIT_ATTRS = [
            'button[type="submit"]',
            'button:has-text("Ingresar")',
            'button:has-text("Iniciar sesión")',
            'button:has-text("Acceder")',
            'button:has-text("Login")',
            'input[type="submit"]'
          ];

          async function waitIdle() {
            await page.waitForLoadState('domcontentloaded', { timeout: NAV_TIMEOUT }).catch(()=>{});
            await page.waitForLoadState('networkidle', { timeout: NAV_TIMEOUT }).catch(()=>{});
          }

          async function findByLabels(labels) {
            // getByLabel busca por <label for> y aria-label accesible (robusto)
            for (const lbl of labels) {
              const ctrl = page.getByLabel(lbl, { exact: false });
              if (await ctrl.first().isVisible().catch(()=>false)) return ctrl.first();
              // intentar en iframes también
              for (const f of page.frames()) {
                const c2 = f.getByLabel(lbl, { exact: false });
                if (await c2.first().isVisible().catch(()=>false)) return c2.first();
              }
            }
            // fallback: label → input hermano
            for (const lbl of labels) {
              const cand = page.locator(`label:has-text("${lbl}")`).locator('..').locator('input');
              if (await cand.first().isVisible().catch(()=>false)) return cand.first();
              for (const f of page.frames()) {
                const c2 = f.locator(`label:has-text("${lbl}")`).locator('..').locator('input');
                if (await c2.first().isVisible().catch(()=>false)) return c2.first();
              }
            }
            return null;
          }

          async function findByAttrs(attrs) {
            const frames = [page.mainFrame(), ...page.frames()];
            const deadline = Date.now() + FIND_TIMEOUT;
            while (Date.now() < deadline) {
              for (const f of frames) {
                for (const sel of attrs) {
                  const loc = f.locator(sel);
                  if (await loc.first().isVisible().catch(()=>false)) return loc.first();
                  // intenta también selector “pierce” por si hay Shadow DOM
                  const pierce = f.locator(`:light(${sel})`);
                  if (await pierce.first().isVisible().catch(()=>false)) return pierce.first();
                }
              }
              await page.waitForTimeout(250);
            }
            return null;
          }

          try {
            console.log("🔐 Abriendo login:", LOGIN_URL);
            await page.goto(LOGIN_URL, { waitUntil: 'domcontentloaded', timeout: NAV_TIMEOUT });
            await waitIdle();

            // EMAIL
            let email = await findByLabels(EMAIL_LABELS);
            if (!email) email = await findByAttrs(EMAIL_ATTRS);
            if (!email) throw new Error('No se encontró input de email/usuario');
            await email.fill(USER, { timeout: FIND_TIMEOUT });

            // PASSWORD
            let pass = await findByLabels(PASS_LABELS);
            if (!pass) pass = await findByAttrs(PASS_ATTRS);
            if (!pass) throw new Error('No se encontró input de contraseña');
            await pass.fill(PASS, { timeout: FIND_TIMEOUT });

            // SUBMIT
            let submit = await findByAttrs(SUBMIT_ATTRS);

            const t0 = await page.evaluate(() => performance.now());
            if (submit) {
              await Promise.all([
                submit.click(),
                page.waitForURL('**/patient*', { timeout: NAV_TIMEOUT })
              ]);
            } else {
              await Promise.all([
                pass.press('Enter'),
                page.waitForURL('**/patient*', { timeout: NAV_TIMEOUT })
              ]);
            }
            await waitIdle();
            const t1 = await page.evaluate(() => performance.now());
            const durationMs = Math.round(t1 - t0);

            console.log(`✅ Login → /patient en ${durationMs} ms`);
            fs.writeFileSync('frontend_metrics.json', JSON.stringify({
              metric: "frontend_login_to_patient_ms",
              duration_ms: durationMs,
              status: "success",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            }, null, 2));
          } catch (err) {
            console.error("❌ Error midiendo login → /patient:", err?.message || err);
            try {
              await page.screenshot({ path: 'error_screenshot.png', fullPage: true });
              const html = await page.content();
              fs.writeFileSync('error_page.html', html.replace(/\s+/g,' ').slice(0, 500000));
            } catch {}
            fs.writeFileSync('frontend_metrics.json', JSON.stringify({
              metric: "frontend_login_to_patient_ms",
              error: String(err),
              status: "failure",
              at: new Date().toISOString(),
              login_url: LOGIN_URL,
              target_url: TARGET_URL
            }, null, 2));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          JS

          node login_and_measure.mjs
      

      - name: Subir artefactos (resultado y screenshot si hay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend_metrics
          path: |
            frontend_metrics.json
            error_screenshot.png
