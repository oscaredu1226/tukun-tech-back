name: Enviar métricas de CI a Grafana Cloud (OTLP)

on:
  workflow_dispatch:
  push:

jobs:
  send-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTelemetry libraries
        run: |
          python -m pip install --upgrade pip
          pip install opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp

      - name: Enviar métricas OTLP a Grafana Cloud
        env:
          OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }} # p.ej. https://otlp-gateway-prod-sa-east-1.grafana.net/otlp
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}      # tu token glc_...
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          python << 'PY'
          import os, time, random
          from opentelemetry import metrics
          from opentelemetry.metrics import Observation  # <- correcto para callbacks
          from opentelemetry.sdk.resources import Resource
          from opentelemetry.sdk.metrics import MeterProvider
          from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader
          from opentelemetry.exporter.otlp.proto.http.metric_exporter import OTLPMetricExporter

          endpoint = os.environ["OTLP_ENDPOINT"].rstrip("/")
          token    = os.environ["GRAFANA_TOKEN"]

          # Exportador OTLP HTTP con autenticación Bearer
          exporter = OTLPMetricExporter(
              endpoint=f"{endpoint}/v1/metrics",
              headers=(("Authorization", f"Bearer {token}"),),
          )

          # Atributos (labels) globales
          resource = Resource.create({
              "service.name": "github-actions",
              "service.namespace": "ci",
              "service.instance.id": os.environ.get("GITHUB_RUN_ID","local"),
              "ci.repo": os.environ.get("GITHUB_REPO",""),
              "ci.workflow": os.environ.get("GITHUB_WORKFLOW",""),
              "git.branch": os.environ.get("GITHUB_REF",""),
              "git.commit": os.environ.get("GITHUB_SHA",""),
          })

          # Reader que exporta periódicamente
          reader = PeriodicExportingMetricReader(exporter, export_interval_millis=3000)
          provider = MeterProvider(resource=resource, metric_readers=[reader])
          metrics.set_meter_provider(provider)
          meter = metrics.get_meter("ci-metrics", "1.0.0")

          # Métricas
          total_pushes   = meter.create_counter("ci_metric_push_total")
          build_duration = meter.create_histogram("ci_build_duration_seconds")

          # ObservableGauge: el callback debe devolver Observation
          def step_value_cb(options):
              return [Observation(random.randint(1,5), {"step": "emit"})]
          meter.create_observable_gauge("ci_step_value", callbacks=[step_value_cb])

          # Simulación de ejecución CI
          start = time.time()
          for i in range(3):
              total_pushes.add(1, {"fase": f"fase_{i+1}"})
              time.sleep(1)
          build_duration.record(time.time() - start, {"resultado": "exitoso"})

          # Espera para que el reader exporte
          time.sleep(6)
          provider.shutdown()
          print("✅ Métricas exportadas correctamente a Grafana Cloud.")
          PY
